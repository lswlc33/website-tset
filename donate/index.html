<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Leckerli+One">
</head>

<body>
    <button id="theme_toggle" title="Toggle dark/light mode">
        <div id="toggle_icon">
            <svg id="sun_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg id="moon_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </div>
    </button>
    <div id="background">
        <div id="content">
            <div id="title">Donate</div>
            <div id="card">
                <div id="qr_switch_div">
                    <div id="qr_switch">
                        <div id="qr_switch_alipay">Alipay</div>
                        <div id="qr_switch_wechat">Wechat</div>
                    </div>
                </div>
                <div id="qr_code">
                    <img id="alipay" class="qr_code_img" src="img/a.png" alt="alipay">
                    <img id="wechat" class="qr_code_img" src="img/w.png" alt="wechat">
                </div>
                <div>Thank you!</div>
            </div>
        </div>
</body>

<style>
    * {
        margin: 0;
        padding: 0;
        user-select: none;
        font-family: "Leckerli One", palatino, serif;
    }

    #background {
        width: 100dvw;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: white;
    }

    #content {
        max-width: 300px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    #title {
        font-size: 60px;
        font-weight: 800;
        margin-bottom: 20px;
    }

    #card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        border: 3px solid black;
        border-radius: 50px;
        font-size: 20px;
    }

    #qr_switch_div {

        display: flex;
        justify-content: center;
        font-weight: 800;
    }

    #qr_switch {
        display: flex;
        justify-content: center;
    }


    #qr_switch_alipay {
        padding: 5px 10px 5px 15px;
        background-color: black;
        color: white;
        border: 3px solid black;
        border-right: none;
        border-radius: 99px 0 0 99px;
        transition: color 1s,background-color 1s;
    }

    #qr_switch_wechat {
        padding: 5px 15px 5px 10px;
        border: 3px solid black;
        border-radius: 0 99px 99px 0;
        transition: color 1s,background-color 1s;
    }

    #qr_code {
        padding: 20px 10px;
    }

    .qr_code_img {
        width: 100%;
        height: 100%;
        display: block;
    }

    #wechat {
        display: none;
    }

    #theme_toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 3px solid black;
        background: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: background-color 0.6s, border-color 0.6s, transform 0.3s;
        overflow: hidden;
    }

    #theme_toggle:hover {
        transform: scale(1.1);
    }

    #toggle_icon {
        width: 26px;
        height: 26px;
        position: relative;
    }

    #toggle_icon svg {
        width: 26px;
        height: 26px;
        position: absolute;
        top: 0;
        left: 0;
        transition: opacity 0.4s, transform 0.5s;
    }

    #sun_icon {
        opacity: 1;
        transform: rotate(0deg) scale(1);
        color: black;
    }

    #moon_icon {
        opacity: 0;
        transform: rotate(-90deg) scale(0.5);
        color: white;
    }

    #background, #card, #qr_switch_alipay, #qr_switch_wechat, #theme_toggle {
        transition: background-color 0.6s, color 0.6s, border-color 0.6s;
    }

    .qr_code_img {
        transition: filter 0.6s;
    }

    body.dark #background {
        background-color: #1a1a2e;
    }

    body.dark #title {
        color: #e0e0e0;
    }

    body.dark #card {
        border-color: #e0e0e0;
        color: #e0e0e0;
    }

    body.dark #qr_switch_alipay {
        background-color: #e0e0e0;
        color: #1a1a2e;
        border-color: #e0e0e0;
    }

    body.dark #qr_switch_wechat {
        border-color: #e0e0e0;
        color: #e0e0e0;
    }

    body.dark .qr_code_img {
        filter: invert(1);
    }

    body.dark #theme_toggle {
        background: #1a1a2e;
        border-color: #e0e0e0;
    }

    body.dark #sun_icon {
        opacity: 0;
        transform: rotate(90deg) scale(0.5);
    }

    body.dark #moon_icon {
        opacity: 1;
        transform: rotate(0deg) scale(1);
    }
</style>

<script>
    var alipay = document.getElementById('alipay');
    var wechat = document.getElementById('wechat');
    var qr_switch_alipay = document.getElementById('qr_switch_alipay');
    var qr_switch_wechat = document.getElementById('qr_switch_wechat');
    var themeToggle = document.getElementById('theme_toggle');

    var isDark = false;

    themeToggle.addEventListener('click', function () {
        isDark = !isDark;
        document.body.classList.toggle('dark', isDark);

        var activeBtn = isDark ? qr_switch_alipay : qr_switch_alipay;
        if (alipay.style.display !== 'none' && wechat.style.display !== 'block') {
            updateSwitchStyle('alipay');
        } else {
            updateSwitchStyle('wechat');
        }
    });

    function updateSwitchStyle(active) {
        if (isDark) {
            if (active === 'alipay') {
                qr_switch_alipay.style.backgroundColor = '#e0e0e0';
                qr_switch_alipay.style.color = '#1a1a2e';
                qr_switch_alipay.style.borderColor = '#e0e0e0';
                qr_switch_wechat.style.backgroundColor = '#1a1a2e';
                qr_switch_wechat.style.color = '#e0e0e0';
                qr_switch_wechat.style.borderColor = '#e0e0e0';
            } else {
                qr_switch_wechat.style.backgroundColor = '#e0e0e0';
                qr_switch_wechat.style.color = '#1a1a2e';
                qr_switch_wechat.style.borderColor = '#e0e0e0';
                qr_switch_alipay.style.backgroundColor = '#1a1a2e';
                qr_switch_alipay.style.color = '#e0e0e0';
                qr_switch_alipay.style.borderColor = '#e0e0e0';
            }
        } else {
            if (active === 'alipay') {
                qr_switch_alipay.style.backgroundColor = 'black';
                qr_switch_alipay.style.color = 'white';
                qr_switch_alipay.style.borderColor = 'black';
                qr_switch_wechat.style.backgroundColor = 'white';
                qr_switch_wechat.style.color = 'black';
                qr_switch_wechat.style.borderColor = 'black';
            } else {
                qr_switch_wechat.style.backgroundColor = 'black';
                qr_switch_wechat.style.color = 'white';
                qr_switch_wechat.style.borderColor = 'black';
                qr_switch_alipay.style.backgroundColor = 'white';
                qr_switch_alipay.style.color = 'black';
                qr_switch_alipay.style.borderColor = 'black';
            }
        }
    }

    qr_switch_alipay.addEventListener('click', function () {
        alipay.style.display = 'block';
        wechat.style.display = 'none';
        updateSwitchStyle('alipay');
    });

    qr_switch_wechat.addEventListener('click', function () {
        alipay.style.display = 'none';
        wechat.style.display = 'block';
        updateSwitchStyle('wechat');
    });

</script>

</html>
