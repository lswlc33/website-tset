<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公会深域可视化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .sort-icon { display: inline-block; vertical-align: middle; margin-left: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20">

    <header class="bg-white shadow-sm sticky top-0 z-30 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 py-4 space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white shadow-lg shadow-indigo-200">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <h1 class="text-xl font-bold text-slate-800">公会深域可视化</h1>
                </div>
                
                <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto">
                    <div class="md:hidden w-full relative">
                        <select id="mobile-sort" class="w-full appearance-none bg-white border border-slate-200 text-slate-700 py-2 pl-3 pr-8 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="totalProgressScore">排序: 总进度 (默认)</option>
                            <option value="level">排序: 骑士等级</option>
                            <option value="fire">排序: 火属性</option>
                            <option value="water">排序: 水属性</option>
                            <option value="wind">排序: 风属性</option>
                            <option value="light">排序: 光属性</option>
                            <option value="dark">排序: 暗属性</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
                        </div>
                    </div>

                    <div class="relative flex-1 md:w-64">
                        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        </div>
                        <input type="text" id="search-input" placeholder="搜索成员..." class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                    </div>

                    <button id="toggle-input-btn" class="px-3 py-2 rounded-lg border bg-white border-slate-200 text-slate-600 hover:bg-slate-50 flex justify-center items-center gap-2 text-sm font-medium transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                        <span class="md:inline">数据源</span>
                    </button>
                </div>
            </div>

            <div id="input-area" class="hidden p-4 bg-slate-100 rounded-lg border border-slate-200 fade-in">
                <textarea id="data-input" class="w-full h-48 p-3 border border-slate-300 rounded-md font-mono text-xs focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 outline-none"></textarea>
                <div class="mt-2 text-right">
                    <button id="reset-data-btn" class="text-xs text-indigo-600 hover:underline">重置为示例数据</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-2 md:px-4 py-4 md:py-6">
        <div class="mb-4 flex flex-wrap gap-4 text-sm text-slate-500 px-1">
            <span>总人数: <strong id="stats-count" class="text-slate-700">0</strong></span>
            <span>平均等级: <strong id="stats-avg-level" class="text-slate-700">0</strong></span>
            <span class="text-slate-400 ml-1">(在“数据源”中填充来自bot的数据)</span>
        </div>

        <div class="hidden md:block bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full min-w-[800px] border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="px-4 py-3 w-16">排名</th>
                            <th class="px-4 py-3 w-48">昵称</th>
                            <th class="px-4 py-3 w-28 cursor-pointer hover:bg-slate-100 select-none" data-sort="level">
                                <div class="flex items-center gap-1.5 text-slate-600">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                                    <span>等级</span><span class="sort-icon" id="icon-level"></span>
                                </div>
                            </th>
                            <th class="px-4 py-3 w-28 cursor-pointer hover:bg-slate-100 select-none" data-sort="totalProgressScore">
                                <div class="flex items-center gap-1.5 text-slate-600">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                                    <span>总进度</span><span class="sort-icon" id="icon-totalProgressScore"></span>
                                </div>
                            </th>
                            <th class="px-4 py-3 w-24 cursor-pointer hover:bg-slate-100 select-none" data-sort="fire">
                                <div class="flex items-center gap-1.5 text-red-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.113.434-2.128 1.154-2.882A3 3 0 0 0 8.5 14.5Z"/></svg>
                                    <span>火</span><span class="sort-icon" id="icon-fire"></span>
                                </div>
                            </th>
                            <th class="px-4 py-3 w-24 cursor-pointer hover:bg-slate-100 select-none" data-sort="water">
                                <div class="flex items-center gap-1.5 text-blue-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.8-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/></svg>
                                    <span>水</span><span class="sort-icon" id="icon-water"></span>
                                </div>
                            </th>
                            <th class="px-4 py-3 w-24 cursor-pointer hover:bg-slate-100 select-none" data-sort="wind">
                                <div class="flex items-center gap-1.5 text-green-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
                                    <span>风</span><span class="sort-icon" id="icon-wind"></span>
                                </div>
                            </th>
                            <th class="px-4 py-3 w-24 cursor-pointer hover:bg-slate-100 select-none" data-sort="light">
                                <div class="flex items-center gap-1.5 text-yellow-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                                    <span>光</span><span class="sort-icon" id="icon-light"></span>
                                </div>
                            </th>
                            <th class="px-4 py-3 w-24 cursor-pointer hover:bg-slate-100 select-none" data-sort="dark">
                                <div class="flex items-center gap-1.5 text-gray-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                                    <span>暗</span><span class="sort-icon" id="icon-dark"></span>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

        <div id="mobile-list" class="md:hidden space-y-3"></div>

        <div id="empty-state" class="hidden py-12 text-center text-slate-400">未找到匹配成员</div>

        <footer class="mt-8 py-6 text-center text-xs text-slate-400 border-t border-slate-100">
            <p>Design by Gemini Canvas</p>
        </footer>
    </main>

    <script>
        const DEFAULT_INPUT = `公会成员深域进度：
大佬：
公主骑士等级720
深域进度：火: 10-6/水: 10-6/风: 10-6/光: 10-6/暗: 10-6

小登：
公主骑士等级62
深域进度：火: 5-1/水: 5-1/风: 5-1/光: 5-1/暗: 5-1

杂鱼：
公主骑士等级20
深域进度：火: 1-1/水: 1-1/风: 1-1/光: 1-1/暗: 1-1`;

        let parsedData = [], searchTerm = '', sortConfig = { key: 'totalProgressScore', direction: 'desc' };
        
        const ELS = {
            fire: { label: '火', base: 'red' }, water: { label: '水', base: 'blue' },
            wind: { label: '风', base: 'green' }, light: { label: '光', base: 'yellow' },
            dark: { label: '暗', base: 'gray' }
        };

        const ICONS = {
            up: `<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>`,
            down: `<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>`,
            none: `<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>`
        };

        // 恢复更稳健的解析逻辑
        function parseData(text) {
            if (!text) return [];
            try {
                const blocks = text.trim().split(/\n\s*\n/);
                const members = [];
                
                blocks.forEach(block => {
                    const lines = block.split('\n').map(l => l.trim()).filter(l => l);
                    let name = "";
                    let level = 0;
                    let progressRaw = "";
                    
                    lines.forEach(line => {
                        if (line.includes('公主骑士等级')) {
                            const match = line.match(/公主骑士等级\s*(\d+)/);
                            if (match) level = parseInt(match[1], 10);
                        } else if (line.includes('深域进度')) {
                            progressRaw = line.replace(/深域进度[：:]\s*/, '');
                        } else if (line.endsWith('：') || line.endsWith(':')) {
                            name = line.slice(0, -1);
                        } else if (!name && !line.includes('公会成员深域进度')) {
                            name = line;
                        }
                    });

                    if (name && level) {
                        const elementsData = {
                            fire: { area: 0, node: 0, score: 0, label: '?' },
                            water: { area: 0, node: 0, score: 0, label: '?' },
                            wind: { area: 0, node: 0, score: 0, label: '?' },
                            light: { area: 0, node: 0, score: 0, label: '?' },
                            dark: { area: 0, node: 0, score: 0, label: '?' },
                        };
                        const parts = progressRaw.split('/');
                        parts.forEach(part => {
                            const [typeStr, valStr] = part.split(/[:：]\s*/);
                            if (typeStr && valStr) {
                                let key = '';
                                if (typeStr.includes('火')) key = 'fire';
                                else if (typeStr.includes('水')) key = 'water';
                                else if (typeStr.includes('风')) key = 'wind';
                                else if (typeStr.includes('光')) key = 'light';
                                else if (typeStr.includes('暗')) key = 'dark';
                                
                                if (key) {
                                    const [area, node] = valStr.split(/[-]/).map(n => parseInt(n, 10));
                                    elementsData[key] = {
                                        area: area || 0,
                                        node: node || 0,
                                        score: (area || 0) * 100 + (node || 0),
                                        label: valStr
                                    };
                                }
                            }
                        });
                        const totalProgressScore = Object.values(elementsData).reduce((acc, curr) => acc + curr.score, 0);
                        members.push({
                            id: Math.random().toString(36).substr(2, 9),
                            name,
                            level,
                            elements: elementsData,
                            totalProgressScore
                        });
                    }
                });
                return members;
            } catch (e) {
                console.error("数据解析失败:", e);
                return [];
            }
        }

        function getCellClasses(area, base) {
            const n = Math.min(Math.max(area, 0), 6);
            const b = { red:'bg-red', blue:'bg-blue', green:'bg-green', yellow:'bg-yellow', gray:'bg-gray' }[base] || 'bg-slate';
            const bg = n===0 ? 'bg-slate-50' : `${b}-${[50,50,100,200,300,400,500][n]}`;
            const txt = area >= 5 ? 'text-white font-bold' : (area >= 3 ? `text-${base}-900 font-medium` : 'text-slate-600');
            return `${bg} ${txt}`;
        }

        const escapeHtml = u => u.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

        function updateUI() {
            let list = parsedData.filter(m => m.name.toLowerCase().includes(searchTerm.toLowerCase()));
            list.sort((a, b) => {
                const va = ELS[sortConfig.key] ? a.elements[sortConfig.key].score : a[sortConfig.key];
                const vb = ELS[sortConfig.key] ? b.elements[sortConfig.key].score : b[sortConfig.key];
                return (sortConfig.direction === 'asc' ? 1 : -1) * (va < vb ? -1 : (va > vb ? 1 : 0));
            });

            document.getElementById('stats-count').textContent = list.length;
            document.getElementById('stats-avg-level').textContent = list.length ? (list.reduce((a,c)=>a+c.level,0)/list.length).toFixed(1) : 0;
            
            const tbody = document.getElementById('table-body');
            const mList = document.getElementById('mobile-list');
            const empty = document.getElementById('empty-state');
            
            if (!list.length) {
                tbody.innerHTML = mList.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            tbody.innerHTML = list.map((m, i) => `
                <tr class="hover:bg-slate-50 transition-colors group">
                    <td class="px-4 py-3 text-slate-400 font-mono text-xs">${i + 1}</td>
                    <td class="px-4 py-3"><div class="font-medium text-slate-700 group-hover:text-indigo-700 truncate max-w-[12rem]">${escapeHtml(m.name)}</div></td>
                    <td class="px-4 py-3"><span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-800 border border-slate-200">Lv.${m.level}</span></td>
                    <td class="px-4 py-3 text-xs font-mono text-slate-500"><div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden"><div class="bg-pink-500 h-full" style="width:${Math.min(m.totalProgressScore/2500*100,100)}%"></div></div></td>
                    ${Object.keys(ELS).map(k => `<td class="px-2 py-2"><div class="flex items-center justify-center h-8 rounded-md ${getCellClasses(m.elements[k].area, ELS[k].base)} font-mono text-sm">${m.elements[k].label}</div></td>`).join('')}
                </tr>`).join('');

            mList.innerHTML = list.map((m, i) => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-start mb-3 pb-3 border-b border-slate-100">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <span class="flex-shrink-0 flex items-center justify-center w-6 h-6 rounded bg-slate-100 text-xs font-mono text-slate-500">${i + 1}</span>
                            <div class="min-w-0"><div class="font-bold text-slate-800 truncate text-base">${escapeHtml(m.name)}</div><div class="text-xs text-slate-400 mt-0.5">综合评分: ${m.totalProgressScore}</div></div>
                        </div>
                        <span class="flex-shrink-0 px-2 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded border border-indigo-100">Lv.${m.level}</span>
                    </div>
                    <div class="grid grid-cols-5 gap-1.5">
                        ${Object.keys(ELS).map(k => `<div class="flex flex-col gap-1"><div class="flex items-center justify-center h-8 rounded ${getCellClasses(m.elements[k].area, ELS[k].base)} font-mono text-xs shadow-sm">${m.elements[k].label}</div></div>`).join('')}
                    </div>
                </div>`).join('');

            document.querySelectorAll('.sort-icon').forEach(el => el.innerHTML = ICONS.none);
            const icon = document.getElementById(`icon-${sortConfig.key}`);
            if(icon) icon.innerHTML = sortConfig.direction === 'asc' ? ICONS.up : ICONS.down;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const dInput = document.getElementById('data-input'), sInput = document.getElementById('search-input');
            dInput.value = DEFAULT_INPUT;
            parsedData = parseData(DEFAULT_INPUT);
            updateUI();

            dInput.addEventListener('input', e => { parsedData = parseData(e.target.value); updateUI(); });
            sInput.addEventListener('input', e => { searchTerm = e.target.value; updateUI(); });
            
            document.getElementById('toggle-input-btn').addEventListener('click', function() {
                const area = document.getElementById('input-area');
                const isHidden = area.classList.toggle('hidden');
                this.classList.toggle('bg-slate-100', !isHidden);
                this.classList.toggle('bg-white', isHidden);
            });
            
            document.getElementById('reset-data-btn').addEventListener('click', () => {
                dInput.value = DEFAULT_INPUT; parsedData = parseData(DEFAULT_INPUT); updateUI();
            });

            document.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => {
                const k = th.getAttribute('data-sort');
                sortConfig = { key: k, direction: sortConfig.key === k && sortConfig.direction === 'desc' ? 'asc' : 'desc' };
                updateUI();
            }));

            document.getElementById('mobile-sort').addEventListener('change', e => {
                sortConfig = { key: e.target.value, direction: 'desc' }; updateUI();
            });
        });
    </script>
</body>
</html>
