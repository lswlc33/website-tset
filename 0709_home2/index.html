<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="noti.css">
</head>

<body>
    <div class="index_list" style="left: 0;">
        <div class="index_item" id="index_page">
            <div class="index_back1">
                <div class="index_day">Saturday</div>
                <div class="index_back2">
                    <div class="index_time">12:00</div>
                </div>
            </div>

        </div>
        <div class="index_item" id="sec_page">2</div>
        <div class="index_item" id="th_page">3</div>
    </div>
    <div class="side_bar" style="right: 0;">
        <div class="side_bar_top">
            <div class="side_bar_user_img"></div>
            <div class="side_bar_user_name">ZYY</div>
            <div class="side_bar_user_desc">恰沐春风共同游，终只叹，木已舟。</div>
        </div>
        <div class="side_bar_main">
            <div class="side_bar_main_list">
                <div class="side_bar_main_item" onclick="index_switch_to(1)"><img src="image/ic_home.svg" alt=""></div>
                <div class="side_bar_main_item" onclick="index_switch_to(2)"><img src="image/ic_cloud.svg" alt=""></div>
                <div class="side_bar_main_item" onclick="index_switch_to(3)"><img src="image/ic_music.svg" alt=""></div>
            </div>
        </div>
        <div class="side_bar_tips"></div>

    </div>
    <div class="nav_list">
        <div class="nav_block">打打打打哇 </div>
        <div class="nav_block">打打打打哇 </div>
        <div class="nav_block">打打打打哇 </div>
        <div class="nav_block">打打打打哇 </div>
        <div class="nav_block">打打打打哇 </div>
        <div class="nav_block">打打打打哇 </div>
    </div>
    <script>
        let index_items = document.querySelectorAll(".index_item")
        let index_list = document.querySelector(".index_list")
        let side_bar = document.querySelector(".side_bar")
        let nav_list = document.querySelector(".nav_list")

        let is_side_move = false


        // 首页翻页函数
        function index_switch_to(page) {
            let ty = - (page - 1) * 100
            index_items.forEach((index_item) => {
                index_item.classList.add("index_item_tran")
                setTimeout(() => {
                    index_list.style.transform = `translateY(${ty}dvh)`
                }, 250);

                setTimeout(() => {
                    index_item.classList.remove("index_item_tran")
                }, 500);
            })
        }


        side_bar.addEventListener("mousedown", (e) => {
            window.addEventListener("mousemove", mousemove)
            is_side_move = true
            init_padding_right = parseInt(side_bar.style.right)
            init_padding_left = e.clientX
        });

        side_bar.addEventListener("mouseup", (e) => {
            let is_left = e.clientX < window.innerWidth / 2 ? true : false
            window.removeEventListener("mousemove", mousemove)
            is_side_move = false

            // 拖动自动吸附
            let to_side = () => {
                if (is_side_move) return // 防止重复操作冲突
                let side_right = parseInt(side_bar.style.right)
                // 移动超出处理
                if (side_right < 0) { side_bar.style.right = 0 }
                if (side_right > window.innerWidth - 80) { side_bar.style.right = window.innerWidth - 80 }
                // 移动
                if ((is_left && side_right < window.innerWidth - 80) || (!is_left && side_right > 0)) {
                    side_bar.style.right = `${side_right + (is_left ? 5 : -5)}px`
                    requestAnimationFrame(to_side)
                }
            };
            requestAnimationFrame(to_side)
        })

        function mousemove(e) {
            let padding_right = init_padding_right + init_padding_left - e.clientX
            side_bar.style.right = `${padding_right}px`
        }

        // 侧边栏移动跟随
        side_loop = () => {
            let side_right = parseInt(side_bar.style.right)
            let index_per = side_right / window.innerWidth
            index_list.style.left = `-${side_right / 5}px`
            nav_list.style.right = `${side_right - window.innerWidth + 80}px`
            index_list.style.filter = `blur(${index_per * 30}px) brightness(${(1 - index_per * 0.8)})`
            // requestAnimationFrame(side_loop)
        }
        setInterval(() => {
            requestAnimationFrame(side_loop)
        }, 10);
    </script>
</body>

</html>
