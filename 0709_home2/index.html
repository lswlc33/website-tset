<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="noti.css">
</head>

<body>
    <div class="index_list" style="left: 0;">
        <div class="index_item" id="index_page">
            <div class="index_back1">
                <div class="index_day">Saturday</div>
                <div class="index_back2">
                    <div class="index_time">12:00</div>
                </div>
            </div>

        </div>
        <div class="index_item" id="sec_page">2</div>
        <div class="index_item" id="th_page">3</div>
    </div>
    <div class="side_bar" style="right: 0;">
        <div class="side_bar_top">
            <div class="side_bar_user_img"></div>
            <div class="side_bar_user_name">ZYY</div>
            <div class="side_bar_user_desc">恰沐春风共同游，终只叹，木已舟。</div>
        </div>
        <div class="side_bar_main">
            <div class="side_bar_main_list">
                <div class="side_bar_main_item" onclick="index_switch_to(1)"><img src="image/ic_home.svg" alt=""></div>
                <div class="side_bar_main_item" onclick="index_switch_to(2)"><img src="image/ic_cloud.svg" alt=""></div>
                <div class="side_bar_main_item" onclick="index_switch_to(3)"><img src="image/ic_music.svg" alt=""></div>
            </div>
        </div>
        <div class="side_bar_tips"></div>

    </div>
    <div class="nav_list">
        <div class="nav_block">打打打打哇 </div>
        <div class="nav_block">打打打打哇 </div>
        <div class="nav_block">打打打打哇 </div>
        <div class="nav_block">打打打打哇 </div>
        <div class="nav_block">打打打打哇 </div>
        <div class="nav_block">打打打打哇 </div>
    </div>
    <script>
        const indexItems = document.querySelectorAll('.index_item');
        const indexList = document.querySelector('.index_list');
        const sideBar = document.querySelector('.side_bar');
        const navList = document.querySelector('.nav_list');

        let isSideMoving = false;
        let initialPaddingRight;
        let initialPaddingLeft;
        let currentX = 0;

        // 首页翻页函数
        function index_switch_to(page) {
            let ty = - (page - 1) * 100
            indexItems.forEach((index_item) => {
                index_item.classList.add("index_item_tran")
                setTimeout(() => {
                    indexList.style.transform = `translateY(${ty}dvh)`
                }, 250);

                setTimeout(() => {
                    index_item.classList.remove("index_item_tran")
                }, 500);
            })
        }

        // 鼠标按下事件
        function onMouseDown(e) {
            window.addEventListener('mousemove', onMouseMove);
            isSideMoving = true;
            initialPaddingRight = parseInt(sideBar.style.right || 0);
            initialPaddingLeft = e.clientX;
        }

        // 鼠标移动事件
        function onMouseMove(e) {
            if (!isSideMoving) return;
            const newPaddingRight = initialPaddingRight + initialPaddingLeft - e.clientX;
            currentX = e.clientX
            sideBar.style.right = `${newPaddingRight}px`;
        }

        // 鼠标松开事件
        function onMouseUp(e) {
            window.removeEventListener('mousemove', onMouseMove);
            isSideMoving = false;
            autoSnap();
        }

        // 触摸开始事件
        function onTouchStart(e) {
            window.addEventListener('touchmove', onTouchMove);
            isSideMoving = true;
            initialPaddingRight = parseInt(sideBar.style.right || 0);
            initialPaddingLeft = e.touches[0].clientX;
        }

        // 触摸移动事件
        function onTouchMove(e) {
            if (!isSideMoving) return;
            currentX = e.touches[0].clientX;
            const deltaX = currentX - initialPaddingLeft;
            sideBar.style.right = `${initialPaddingRight - deltaX}px`;
        }

        // 触摸结束事件
        function onTouchEnd(e) {
            window.removeEventListener('touchmove', onTouchMove);
            isSideMoving = false;
            autoSnap();
        }

        // 自动吸附逻辑
        function autoSnap() {
            let sideRight = parseInt(sideBar.style.right || 0);
            if (sideRight < 0) sideBar.style.right = '0';
            if (sideRight > document.documentElement.clientWidth - 80) {
                sideBar.style.right = `${document.documentElement.clientWidth - 80}px`
            };
            if (sideRight > 0 && sideRight < document.documentElement.clientWidth - 80) {
                const isLeft = currentX < document.documentElement.clientWidth / 2;
                console.log(isLeft,currentX , document.documentElement.clientWidth / 2)
                sideBar.style.right = `${sideRight + (isLeft ? 10 : -10)}px`;
                requestAnimationFrame(autoSnap);
            }
        }

        // 侧边栏移动跟随逻辑
        function sideBarLoop() {
            const sideRight = parseInt(sideBar.style.right || 0);
            const indexPer = sideRight / document.documentElement.clientWidth;
            indexList.style.left = `-${sideRight / 5}px`;
            navList.style.right = `${sideRight - document.documentElement.clientWidth + 80}px`;
            indexList.style.filter = `blur(${indexPer * 20}px) brightness(${(1 - indexPer * 0.8)})`;
            requestAnimationFrame(sideBarLoop);
        }

        // 事件绑定
        sideBar.addEventListener('mousedown', onMouseDown);
        sideBar.addEventListener('mouseup', onMouseUp);
        sideBar.addEventListener('touchstart', onTouchStart);
        sideBar.addEventListener('touchend', onTouchEnd);

        // 初始化侧边栏移动跟随
        requestAnimationFrame(sideBarLoop);

    </script>
</body>

</html>
