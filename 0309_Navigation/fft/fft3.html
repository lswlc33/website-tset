<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量产网页</title>
</head>

<body>
    <div id="fft_div">
        <div id="title">
            <p id="hitokoto">
            <div id="hitokoto_text">正在获取</div>
            </p>
        </div>
        <div id="text">
            <script>
                async function fetchHitokoto() {
                    const response = await fetch('https://v1.hitokoto.cn')
                    const { uuid, hitokoto: hitokotoText } = await response.json()
                    const hitokoto = document.querySelector('#hitokoto_text')
                    hitokoto.innerText = hitokotoText
                }
                fetchHitokoto()
            </script>
            这是个API调用示例
            <br>
            API：https://v1.hitokoto.cn
            <br>
            刷新网页即可更新句子
            <br>
            <button onclick="fetchHitokoto()">手动刷新</button>
        </div>
    </div>
    <div id="back" onclick="history.back()">返回</div>
</body>

<style>
    * {
        padding: 0;
        margin: 0;
    }

    #fft_div {
        background-color: rgba(255, 255, 255, 0.717);
        border-radius: 20px;
        margin: 50px;
        padding: 20px;
        height: 500px;
    }

    #title {
        font-size: 30px;
        margin-bottom: 20px;
    }

    #text {
        word-break: break-word;
    }

    body {
        background: linear-gradient(45deg, #2bffcd, #d014ff);
        height: 800px;
    }

    #back {
        text-align: center;
        font-size: 25px;
    }
</style>

</html>
