<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP归属地查询</title>
</head>

<body>
    <div id="ip_info_div">
        <h1>IP归属地查询</h1>
        <p id="ip_address">正在获取您的IP地址...</p>
        <p id="ip_location">IP归属地信息将显示在这里。</p>
        <button onclick="fetchIPInfo()">手动查询IP归属地</button>
    </div>

    <script>
        async function fetchIPInfo() {
            const response = await fetch('https://api.ipify.org?format=json')
            const { ip } = await response.json()
            document.getElementById('ip_address').innerText = `您的IP地址是：${ip}`

            const locationResponse = await fetch(`https://ipapi.co/${ip}/json/`)
            const locationData = await locationResponse.json()
            const locationInfo = `IP归属地：${locationData.country_name}, 地区：${locationData.region_name}, 城市：${locationData.city}, 运营商：${locationData.org}`
            document.getElementById('ip_location').innerText = locationInfo
        }
        fetchIPInfo()
    </script>

    <style>
        * {
            padding: 0;
            margin: 0;
        }

        #ip_info_div {
            background-color: rgba(255, 255, 255, 0.717);
            border-radius: 20px;
            margin: 50px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        p {
            margin: 10px 0;
        }

        body {
            background: linear-gradient(45deg, #2bffcd, #d014ff);
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            font-size: 16px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>

</body>

</html>
